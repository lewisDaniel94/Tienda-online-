<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Pedidos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .filters {
            margin: 20px 0;
            display: flex;
            gap: 10px;
        }
        .btn-filter {
            background-color: #bdc3c7;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: #2c3e50;
            transition: background 0.2s;
        }
        .btn-filter.active {
            background-color: #2c3e50;
            color: white;
        }
        h2 {
            border-bottom: 2px solid #ccc;
            padding-bottom: 10px;
        }
        #orders-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .order-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-left: 5px solid #e74c3c;
        }
        .order-card.completado {
            border-left-color: #2ecc71;
            opacity: 0.7;
        }
        .order-card h3 {
            margin-top: 0;
            color: #2c3e50;
        }
        .order-items {
            list-style: none;
            padding: 0;
            margin: 10px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }
        .order-items li {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .order-total {
            font-weight: bold;
            font-size: 16px;
            text-align: right;
            margin-top: 10px;
        }
        .btn-status {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn-status:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

  <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px; background-color: #2c3e50; color: white;">
    <h1 style="margin: 0; font-size: 22px;">Panel de Administración</h1>
    
    <!-- Botón de Cerrar Sesión alineado -->
     <!-- Botón para activar el Cierre Diario -->
<button onclick="window.generarCierreDiario()" style="background-color: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 10px;">
    📅 Cierre Diario
</button>

<!-- Estructura de la Ventana Modal (Se mantiene oculta hasta hacer clic en el botón) -->
<div id="modal-cierre" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
    <div style="background: white; padding: 30px; border-radius: 8px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
        <h2 style="margin-top: 0; color: #2c3e50;">Cierre Diario de Caja</h2>
        
        <!-- Aquí se inyectará dinámicamente el reporte y el botón de vaciar -->
        <div id="contenido-cierre"></div>
        
        <button onclick="document.getElementById('modal-cierre').style.display='none'" style="margin-top: 20px; width: 100%; padding: 10px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
            Cerrar Ventana
        </button>
    </div>
</div>
    <button onclick="window.cerrarSesion()" style="background-color: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;">
        Cerrar Sesión
        
    </button>
    
</header>

    <main class="container">
        <h2>Gestión de Pedidos</h2>
        
        <!-- Botones de Filtro -->
        <div class="filters">
            <button class="btn-filter active" onclick="window.filtrarPedidos('todos', this)">Todos</button>
            <button class="btn-filter" onclick="window.filtrarPedidos('pendiente', this)">Pendientes</button>
            <button class="btn-filter" onclick="window.filtrarPedidos('completado', this)">Completados</button>
        </div>

        <div id="orders-container">
            <p>Conectando y esperando pedidos...</p>
        </div>
    </main>
    

    <!-- Script del Administrador -->
    <script type="module" src="admin.js"></script>
</body>
</html>
