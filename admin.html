<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Pedidos</title>
    <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>

  <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px; background-color: #2c3e50; color: white;">
    <h1 style="margin: 0; font-size: 22px;">Panel de Administración</h1>
    
    <button onclick="window.generarCierreDiario()" style="background-color: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 10px;">
        📅 Cierre Diario
    </button>

    <div id="modal-cierre" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; padding: 30px; border-radius: 8px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            <h2 style="margin-top: 0; color: #2c3e50;">Cierre Diario de Caja</h2>
            <div id="contenido-cierre"></div>
            <button onclick="document.getElementById('modal-cierre').style.display='none'" style="margin-top: 20px; width: 100%; padding: 10px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                Cerrar Ventana
            </button>
        </div>
    </div>

    <button onclick="window.cerrarSesion()" style="background-color: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;">
        Cerrar Sesión
    </button>
</header>

    <main class="container">
        <h2>Gestión de Pedidos</h2>
        
        <div class="filters">
            <button class="btn-filter active" onclick="window.filtrarPedidos('todos', this)">Todos</button>
            <button class="btn-filter" onclick="window.filtrarPedidos('pendiente', this)">Pendientes</button>
            <button class="btn-filter" onclick="window.filtrarPedidos('completado', this)">Completados</button>
        </div>

        <div id="orders-container">
            <p>Conectando y esperando pedidos...</p>
        </div>
    </main>

    <script type="module" src="admin.js"></script>
</body>
</html>
